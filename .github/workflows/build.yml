name: Build Quest APK

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"
  GODOT_SETTINGS_VERSION: "4.7"
  VENDORS_TAG: "5.2.0-stable"
  GODOT_ANDROID_KEYSTORE_DEBUG_USER: "androiddebugkey"
  GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: "android"
  # Size of one rendered picture (models, showroom, ground) and of the virtual screen for it.
  SHOT_SIZE: "1600x1200"
  SHOT_SCREEN: "1920x1440x24"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot and export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          name="Godot_v${GODOT_VERSION}-${GODOT_STATUS}"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "${base}/${name}_linux.x86_64.zip"
          curl -fsSL -o "$RUNNER_TEMP/templates.tpz" "${base}/${name}_export_templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/${name}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$tpl"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/tpl"
          mv "$RUNNER_TEMP/tpl/templates/"* "$tpl/"
          ls "$tpl"

      - name: Download OpenXR Vendors plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$VENDORS_TAG" --repo GodotVR/godot_openxr_vendors --pattern "*.zip" --dir "$RUNNER_TEMP/vendors"
          ls -la "$RUNNER_TEMP/vendors"
          for z in "$RUNNER_TEMP"/vendors/*.zip; do unzip -q -o "$z" -d "$RUNNER_TEMP/vendors_x"; done
          src="$(find "$RUNNER_TEMP/vendors_x" -type d -path "*addons/godotopenxrvendors" | head -n 1)"
          if [ -z "$src" ]; then
            echo "addons/godotopenxrvendors not found in the release archive"
            find "$RUNNER_TEMP/vendors_x" -maxdepth 3
            exit 1
          fi
          mkdir -p game/addons
          cp -r "$src" game/addons/
          ls game/addons/godotopenxrvendors

      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/keystore
          key: debug-keystore-v1

      - name: Create debug keystore if missing
        run: |
          set -euo pipefail
          mkdir -p "$HOME/keystore"
          if [ ! -f "$HOME/keystore/debug.keystore" ]; then
            keytool -genkeypair -keyalg RSA -keysize 2048 -alias androiddebugkey -keypass android -storepass android -keystore "$HOME/keystore/debug.keystore" -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -storetype pkcs12
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/keystore/debug.keystore" >> "$GITHUB_ENV"

      - name: Configure Godot editor settings
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_SETTINGS_VERSION}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/keystore/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-${GODOT_SETTINGS_VERSION}.tres"

      - name: Install Android build template
        run: |
          set -euo pipefail
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p game/android/build
          unzip -q "$tpl/android_source.zip" -d game/android/build
          chmod +x game/android/build/gradlew
          touch game/android/build/.gdignore
          echo "${GODOT_VERSION}.${GODOT_STATUS}" > game/android/.build_version

      - name: Import project
        run: |
          mkdir -p build
          timeout 900 godot --headless --path game --import 2>&1 | tee build/import.log || echo "import returned non-zero"
          if grep -E "SCRIPT ERROR|Parse Error" build/import.log; then
            echo "Script errors found during import"
            exit 1
          fi

      - name: Check models
        run: |
          set -euo pipefail
          timeout 300 godot --headless --xr-mode off --path game --script res://tools/check_models.gd > build/models.log 2>&1 || true
          tail -n 3 build/models.log
          if grep -E "SCRIPT ERROR|Parse Error| FAIL$" build/models.log; then
            echo "Model check failed"
            exit 1
          fi
          grep -q "MODELS_TOTAL" build/models.log

      - name: Check terrain
        run: |
          set -euo pipefail
          timeout 300 godot --headless --xr-mode off --path game --script res://tools/check_terrain.gd 2>&1 | tee build/terrain.log
          if grep -E "SCRIPT ERROR|Parse Error|TERRAIN_FAIL" build/terrain.log; then
            echo "Terrain check failed"
            exit 1
          fi

      - name: Smoke run (headless, no headset)
        run: |
          timeout 120 godot --headless --path game --quit-after 120 > build/smoke.log 2>&1 || echo "smoke run returned non-zero"
          grep -E "^\[main\]|ERROR" build/smoke.log || true
          if grep -E "SCRIPT ERROR|Parse Error" build/smoke.log; then
            echo "Script errors found during smoke run"
            exit 1
          fi

      # Writes separate pictures into build/previews and four of the five big sheets
      # (three with models, one with the showroom) into build/previews/sheets.
      - name: Render model previews (optional)
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          mkdir -p build/previews
          export PREVIEW_DIR="$GITHUB_WORKSPACE/build/previews"
          timeout 600 xvfb-run -a -s "-screen 0 ${SHOT_SCREEN}" godot --xr-mode off --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --resolution "${SHOT_SIZE}" --path game --script res://tools/render_previews.gd > build/previews.log 2>&1
          tail -n 3 build/previews.log

      # Separate pictures of the ground go into build/previews/terrain; then they are glued
      # into the fifth big sheet, so the archive model-sheets holds exactly five pictures.
      - name: Render terrain pictures (optional)
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p build/previews/sheets build/previews/terrain
          export PREVIEW_DIR="$GITHUB_WORKSPACE/build/previews/terrain"
          timeout 600 xvfb-run -a -s "-screen 0 ${SHOT_SCREEN}" godot --xr-mode off --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --resolution "${SHOT_SIZE}" --path game --script res://tools/render_terrain.gd > build/terrain_shots.log 2>&1 || echo "terrain render returned non-zero"
          grep -E "TERRAIN_SHOT" build/terrain_shots.log || true
          export SHEET_SRC="$PREVIEW_DIR"
          export SHEET_OUT="$GITHUB_WORKSPACE/build/previews/sheets/sheet_5_terrain.png"
          timeout 120 godot --headless --xr-mode off --path game --script res://tools/make_sheet.gd > build/sheet_terrain.log 2>&1 || echo "sheet compose returned non-zero"
          grep -E "SHEET_" build/sheet_terrain.log || true

      - name: Upload model previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-previews
          path: build/previews
          if-no-files-found: ignore

      # Small artifact for sending to the agent in the chat: exactly five big pictures
      # (three sheets of models, the showroom, the ground) - one chat message.
      - name: Upload model sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-sheets
          path: build/previews/sheets
          if-no-files-found: ignore

      # TEST (branch model-sheets-preview only): commit the smallest sheet to the branch
      # so that the agent can try to open it as a picture from the repository.
      - name: Publish smallest sheet to the branch (test)
        if: always() && github.ref == 'refs/heads/model-sheets-preview'
        continue-on-error: true
        run: |
          set -euo pipefail
          ls -la build/previews/sheets
          smallest="$(ls -S build/previews/sheets/*.png | tail -n 1)"
          echo "PUBLISHING: $smallest ($(stat -c %s "$smallest") bytes)"
          mkdir -p sheets-preview
          cp "$smallest" sheets-preview/test_sheet.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheets-preview/test_sheet.png
          git commit -m "Test: smallest model sheet ($(basename "$smallest")) from run ${GITHUB_RUN_ID}"
          git push origin HEAD:model-sheets-preview

      - name: Export debug APK
        run: |
          set -euo pipefail
          godot --headless --path game --export-debug "Quest" "$GITHUB_WORKSPACE/build/astro-planet-debug.apk" > build/export.log 2>&1
          test -s build/astro-planet-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: astro-planet-debug-apk
          path: build/astro-planet-debug.apk
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: ignore

      # Short digest at the very end of the job log: an agent reads only the tail of the log.
      - name: Summary
        if: always()
        run: |
          echo "=== SUMMARY ==="
          grep -hE "MODELS_TOTAL| FAIL$|TERRAIN_|PREVIEWS_SAVED|PREVIEW_PICTURE_SIZE|SHEETS_SAVED|SHEET_|^\[main\]|SCRIPT ERROR|Parse Error" build/*.log | head -n 80 || true
          grep -hE -A 6 "SCRIPT ERROR|Parse Error" build/*.log | head -n 60 || true
          ls -la build/previews/sheets 2>/dev/null || echo "NO SHEETS"
          ls -la build/*.apk 2>/dev/null || echo "NO APK"
          echo "=== END SUMMARY ==="
